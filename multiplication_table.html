<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단</title>
</head>
<body>
    <h1>JS 반복문</h1>
    <hr>

    <script>
        for( let dan = 2 ; dan <= 9 ; dan++ ) {
            document.write('<h3>' + dan + '단</h3>');

            for( let i = 1 ; i <= 9 ; i++ ) {
                document.write(dan + ' x ' + i + ' = ' + (dan * i) + '<br>');
            }

            document.write('<br>');
        }
    </script>
</body>
</html>
